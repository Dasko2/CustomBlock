plugins {
    id 'java'
}

group = 'fr.customblock'
version = '1.1.0'

// Version de l'API Paper (Minecraft 26.1.2). Pour une autre version : '26.2.build.+', etc.
def paperVersion = '26.1.2.build.+'

java {
    toolchain {
        // Paper 26.x exige Java 25
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    // Fournie par le serveur à l'exécution : rien n'est embarqué dans le .jar
    compileOnly "io.papermc.paper:paper-api:${paperVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'CustomBlock'
}
