name: CustomBlock
version: '${version}'
main: fr.customblock.Main
api-version: '26.1'
description: Blocs et textures personnalisés pilotés par configuration, avec génération automatique du resource pack.
authors: Dasko2_0

commands:
  customblock:
    description: Gestion des blocs personnalisés
    usage: /customblock [menu|give|list|reload|pack|biome]
    aliases: [cb]
    permission: customblock.admin

permissions:
  customblock.admin:
    description: Accès aux commandes de CustomBlock
    default: op
