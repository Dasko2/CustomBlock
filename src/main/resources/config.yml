# ============================================================
#  CustomBlock
#
#  Ajouter un bloc :
#    1. Dépose ta texture (PNG, ex. 16x16) dans plugins/CustomBlock/textures/
#    2. Ajoute une entrée dans "blocks" avec le nom du fichier dans "texture"
#    3. Fais /customblock reload
#  Le resource pack est généré automatiquement et envoyé aux joueurs.
# ============================================================

# Propriétés d'un bloc :
#   base-material      : matériau de l'item ET du bloc posé (doit être un matériau de bloc)
#   placed-material    : (optionnel) matériau du bloc posé si différent (hitbox, dureté)
#   name               : nom affiché, format MiniMessage
#   lore               : (optionnel) liste de lignes MiniMessage
#   texture            : nom du fichier PNG dans plugins/CustomBlock/textures/
#   custom-model-data  : (optionnel) valeur ajoutée à l'item, utile pour d'autres plugins
#   drop-self          : true = le bloc se récupère en le cassant
blocks:
  ruby_block:
    base-material: REDSTONE_BLOCK
    name: "<gradient:#ff0044:#ff8899><bold>Bloc de Rubis</bold></gradient>"
    lore:
      - "<gray>Un bloc précieux et rare."
      - "<dark_gray>CustomBlock"
    texture: ruby_block.png
    custom-model-data: 1001
    drop-self: true

  sapphire_block:
    base-material: LAPIS_BLOCK
    name: "<gradient:#0044ff:#66ccff><bold>Bloc de Saphir</bold></gradient>"
    lore:
      - "<gray>Brille d'un bleu profond."
    texture: sapphire_block.png
    custom-model-data: 1002
    drop-self: true

  marble_bricks:
    base-material: QUARTZ_BRICKS
    placed-material: STONE_BRICKS
    name: "<white>Briques de marbre"
    texture: marble_bricks.png
    custom-model-data: 1003
    drop-self: true

# ============================================================
#  Objets : outils, armes, armures, objets simples
#
#  Propriétés :
#    material        : matériau de base (ex. DIAMOND_SWORD, NETHERITE_HELMET, PAPER). Il définit le type
#                      d'objet : un pic reste un pic, un casque se porte sur la tête.
#    name / lore     : MiniMessage
#    texture         : icône PNG dans plugins/CustomBlock/textures/
#    armor-texture   : (armures) préfixe des textures portées. Dépose <préfixe>_layer_1.png
#                      (casque, plastron, bottes) et <préfixe>_layer_2.png (jambières) dans textures/.
#                      Utilise le même préfixe pour toutes les pièces d'un set.
#    durability      : (optionnel) durabilité maximale
#    unbreakable     : (optionnel) true = incassable
#    attributes      : (optionnel) attributs. ATTENTION : ils remplacent ceux du matériau d'origine,
#                      donc indique tout ce que l'objet doit avoir (ex. dégâts ET vitesse d'attaque).
#                      attack-damage et attack-speed = valeurs totales affichées en jeu.
#                      Autres : armor, armor-toughness, knockback-resistance, max-health,
#                      movement-speed, attack-knockback, luck, ...
# ============================================================
items:
  ruby_sword:
    material: DIAMOND_SWORD
    name: "<gradient:#ff0044:#ff8899><bold>Épée de Rubis</bold></gradient>"
    lore:
      - "<gray>Forgée dans un rubis pur."
    texture: ruby_sword.png
    durability: 2500
    attributes:
      attack-damage: 9
      attack-speed: 1.6

  ruby_pickaxe:
    material: DIAMOND_PICKAXE
    name: "<red>Pioche de Rubis"
    texture: ruby_pickaxe.png
    durability: 2000
    attributes:
      attack-damage: 5
      attack-speed: 1.2

  ruby_helmet:
    material: DIAMOND_HELMET
    name: "<red>Casque de Rubis"
    texture: ruby_helmet.png
    armor-texture: ruby
    durability: 550
    attributes:
      armor: 3
      armor-toughness: 2

  ruby_chestplate:
    material: DIAMOND_CHESTPLATE
    name: "<red>Plastron de Rubis"
    texture: ruby_chestplate.png
    armor-texture: ruby
    durability: 800
    attributes:
      armor: 8
      armor-toughness: 2

  ruby_leggings:
    material: DIAMOND_LEGGINGS
    name: "<red>Jambières de Rubis"
    texture: ruby_leggings.png
    armor-texture: ruby
    durability: 750
    attributes:
      armor: 6
      armor-toughness: 2

  ruby_boots:
    material: DIAMOND_BOOTS
    name: "<red>Bottes de Rubis"
    texture: ruby_boots.png
    armor-texture: ruby
    durability: 650
    attributes:
      armor: 3
      armor-toughness: 2

# Génération et envoi du resource pack
resource-pack:
  enabled: true
  # Numéro de format de ressources de ta version de Minecraft.
  # Si le client affiche "pack conçu pour une autre version", ajuste cette valeur.
  pack-format: 84
  description: "Textures CustomBlock"
  # true = les joueurs qui refusent le pack sont expulsés
  required: false
  prompt: "<yellow>Ce serveur utilise des textures personnalisées."
  # Hébergement intégré : le plugin sert lui-même le pack en HTTP.
  # "host" = l'IP publique ou le domaine de ton serveur, "port" doit être ouvert (TCP).
  self-host:
    host: "127.0.0.1"
    port: 8163
  # Si tu héberges le pack ailleurs, indique ici son URL directe : l'hébergement intégré est alors désactivé.
  external-url: ""
