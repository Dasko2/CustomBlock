# ============================================================
#  CustomBlock
#
#  Ajouter un bloc ou un objet :
#    1. Dépose tes textures PNG dans plugins/CustomBlock/textures/
#    2. Ajoute une entrée dans "blocks" ou "items" avec les noms de fichiers
#    3. Fais /customblock reload
#  Le resource pack est généré automatiquement et envoyé aux joueurs.
#
#  Au premier lancement, des textures d'exemple sont copiées dans textures/ :
#  remplace-les par les tiennes (même nom de fichier, ou change le nom dans la config).
# ============================================================

# Désactive l'accordage des blocs-note (clic droit). Indispensable : les blocs custom utilisent des
# états de bloc-note, accorder un bloc-note vanilla pourrait lui donner l'apparence d'un bloc custom.
# true = surveille config.yml et textures/ : toute modification recharge le plugin toute seule (~2 s)
# et renvoie le pack aux joueurs seulement s'il a changé.
auto-reload: true

disable-note-tuning: true

# ------------------------------------------------------------
#  BLOCS
#
#  Un bloc posé est un vrai bloc Minecraft dont le modèle est remplacé par le resource pack :
#  éclairage, ombres, night vision et fullbright agissent comme sur un bloc vanilla.
#  Le plugin attribue lui-même un état à chaque bloc (plugins/CustomBlock/generated/block-states.yml).
#  NE SUPPRIME PAS ce fichier : les blocs déjà posés dans le monde changeraient d'apparence.
#
#  base-material      : matériau de l'ITEM porté dans l'inventaire (un bloc, ex. STONE)
#  name / lore        : MiniMessage
#
#  Textures (une seule des 3 formes) :
#    texture: fichier.png                      -> même texture sur les 6 faces
#    textures: { top, bottom, side }           -> dessus, dessous, 4 côtés
#    textures: { up, down, north, south, east, west }   -> chaque face séparément
#
#  orientation        : (optionnel) AXIS = tronc : se pose dans le sens de la face cliquée
#                       (top/bottom = bouts du tronc, side = écorce)
#  hardness           : (optionnel) dureté. Pierre = 1.5, obsidienne = 50, terre = 0.5.
#                       0 = casse instantanée, négatif = incassable. Sans cette ligne : 0.8 (bloc-note).
#  tool               : (optionnel) PICKAXE, AXE, SHOVEL, HOE, SWORD ou NONE.
#                       Sans le bon outil : le bloc se casse plus lentement et ne lâche rien.
#  min-tier           : (optionnel) niveau minimal de l'outil : WOOD, STONE, IRON, DIAMOND, NETHERITE.
#  drops              : (optionnel) liste d'objets lâchés. "item" = ID d'un bloc/objet custom OU matériau vanilla.
#                       amount : quantité fixe (2) ou plage (1-3). chance : % (défaut 100).
#                       Sans "drops", le bloc se lâche lui-même.
#  recipe             : (optionnel) craft, voir la section "CRAFTS" plus bas.
# ------------------------------------------------------------
blocks:
  ruby_ore:
    base-material: DIAMOND_ORE
    name: "<gradient:#ff0044:#ff8899><bold>Minerai de Rubis</bold></gradient>"
    texture: ruby_ore.png
    hardness: 4.0
    tool: PICKAXE
    min-tier: IRON
    # Sons et particules en plus de ceux du bloc-note. Un son = vanilla (block.amethyst_block.break)
    # ou le nom d'un fichier .ogg déposé dans plugins/CustomBlock/sounds/ (sans l'extension).
    place-sound: block.amethyst_block.place
    break-sound: block.amethyst_block.break
    break-particle: CRIT 15
    # silk-touch : true = seulement avec Toucher de soie, false = seulement sans, absent = toujours
    drops:
      - item: ruby_ore      # le bloc lui-même, uniquement avec Toucher de soie
        silk-touch: true
      - item: ruby          # objet custom défini dans "items"
        amount: 1-3
        silk-touch: false
      - item: DIAMOND       # item vanilla, 10 % de chance
        amount: 1
        chance: 10
        silk-touch: false

  ruby_block:
    base-material: REDSTONE_BLOCK
    name: "<gradient:#ff0044:#ff8899><bold>Bloc de Rubis</bold></gradient>"
    lore:
      - "<gray>Un bloc précieux et rare."
    # Dessus, dessous et côtés différents
    textures:
      top: ruby_block_top.png
      bottom: ruby_block_bottom.png
      side: ruby_block_side.png
    hardness: 5.0
    tool: PICKAXE
    min-tier: IRON
    recipe:
      type: shaped
      shape:
        - "RRR"
        - "RRR"
        - "RRR"
      ingredients:
        R: ruby

  marble_bricks:
    base-material: QUARTZ_BRICKS
    name: "<white>Briques de marbre"
    texture: marble_bricks.png
    hardness: 2.0
    tool: PICKAXE
    recipe:
      type: shaped
      amount: 4
      shape:
        - "QQ"
        - "QQ"
      ingredients:
        Q: QUARTZ_BLOCK

  # --- Blocs du biome "ruby_forest" (voir la section "biomes") ---
  ruby_grass:
    base-material: GRASS_BLOCK
    name: "<red>Herbe de Rubis"
    textures:
      top: ruby_grass_top.png
      bottom: ruby_dirt.png
      side: ruby_grass_side.png
    hardness: 0.6
    tool: SHOVEL
    drops:
      - item: ruby_dirt

  ruby_dirt:
    base-material: DIRT
    name: "<#a0522d>Terre de Rubis"
    texture: ruby_dirt.png
    hardness: 0.5
    tool: SHOVEL

  ruby_log:
    base-material: OAK_LOG
    name: "<#c0405a>Bûche de Rubis"
    orientation: AXIS          # se pose debout ou couchée selon la face cliquée
    textures:
      top: ruby_log_top.png
      bottom: ruby_log_top.png
      side: ruby_log_side.png
    hardness: 2.0
    tool: AXE

  ruby_leaves:
    base-material: OAK_LEAVES
    name: "<red>Feuilles de Rubis"
    texture: ruby_leaves.png
    hardness: 0.3
    tool: HOE
    drops:
      - item: STICK
        amount: 1-2
        chance: 25

# ------------------------------------------------------------
#  BIOMES : des zones où l'herbe, la terre et les arbres du monde sont remplacés par tes blocs.
#  Générés dans les NOUVEAUX chunks. Pour les chunks déjà explorés : /cb biome apply [rayon].
#  Ce ne sont pas de vrais biomes Minecraft : ciel, brouillard, mobs et teinte de l'eau restent vanilla.
#
#  worlds            : mondes concernés (défaut : world)
#  based-on          : biomes vanilla où la zone peut apparaître (vide = tous)
#  scale             : taille approximative des zones, en blocs
#  coverage          : part approximative du terrain couvert (0 à 1)
#  clear-vegetation  : retire les arbres et plantes vanilla dans la zone
#  surface           : top = remplace l'herbe, under = remplace la terre dessous (sur under-depth blocs)
#  trees             : log / leaves = blocs custom, height = hauteur du tronc (5-8),
#                      leaf-radius = rayon des feuilles, density = arbres par bloc d'herbe (0.03 = rare)
# ------------------------------------------------------------
biomes:
  ruby_forest:
    worlds: [world]
    based-on: [FOREST, BIRCH_FOREST, FLOWER_FOREST, PLAINS, MEADOW]
    scale: 96
    coverage: 0.4
    clear-vegetation: true
    surface:
      top: ruby_grass
      under: ruby_dirt
      under-depth: 3
    trees:
      - log: ruby_log
        leaves: ruby_leaves
        height: 5-8
        leaf-radius: 3
        density: 0.03

# ------------------------------------------------------------
#  OBJETS : outils, armes, armures, objets simples
#
#  material        : matériau de base (DIAMOND_SWORD, NETHERITE_HELMET, PAPER...).
#                    Il définit le type : une pioche reste une pioche, un casque se porte sur la tête.
#  name / lore     : MiniMessage
#  texture         : icône (inventaire, au sol, en cadre)
#  held-texture    : (optionnel) texture quand l'objet est TENU ou PORTÉ à la main.
#                    Sans elle, "texture" est utilisée partout.
#  armor-texture   : (armures) préfixe des textures portées. Dépose <préfixe>_layer_1.png
#                    (casque, plastron, bottes) et <préfixe>_layer_2.png (jambières).
#                    Même préfixe pour toutes les pièces d'un set.
#  durability      : (optionnel) durabilité maximale
#  unbreakable     : (optionnel) true = incassable
#  attributes      : (optionnel) attributs. ATTENTION : ils remplacent ceux du matériau d'origine.
#                    attack-damage / attack-speed = valeurs totales affichées en jeu.
#                    Armure : armor (protection), armor-toughness (solidité), knockback-resistance (0 à 1).
#                    Autres : max-health, movement-speed, attack-knockback, luck, ...
#  recipe          : (optionnel) craft, voir plus bas.
# ------------------------------------------------------------
items:
  # Barrière invisible infranchissable : pose wall-height blocs BARRIER l'un sur l'autre (1 à 8).
  # En créatif, Maj + casser une barrière retire aussi celles empilées au-dessus.
  invisible_wall:
    material: BARRIER
    name: "<gray>Barrière invisible <dark_gray>(2 de haut)"
    lore:
      - "<gray>Invisible, on ne peut pas sauter par-dessus."
    wall-height: 2

  ruby:
    material: AMETHYST_SHARD
    name: "<red>Rubis"
    texture: ruby.png
    # Plusieurs crafts avec "recipes". Types : shaped, shapeless, furnace, blasting, smoking, campfire,
    # stonecutter, smithing.
    recipes:
      - type: furnace                # cuire le minerai de rubis
        input: ruby_ore
        experience: 1.0
        cooking-time: 10s
      - type: blasting               # même chose au haut-fourneau, deux fois plus vite
        input: ruby_ore
        experience: 1.0
        cooking-time: 5s
    # category: mes_objets           # range l'objet dans une catégorie personnalisée du menu /cb

  ruby_sword:
    material: DIAMOND_SWORD
    name: "<gradient:#ff0044:#ff8899><bold>Épée de Rubis</bold></gradient>"
    lore:
      - "<gray>Forgée dans un rubis pur."
    texture: ruby_sword.png               # icône dans l'inventaire
    held-texture: ruby_sword_held.png     # texture en main
    durability: 2500
    effects:                              # effets de potion : trigger HIT (au coup), HOLD (en main), WEAR (porté)
      - trigger: HIT
        effect: POISON
        duration: 4s                      # 4s, 1.5s, 2m, 100t (ticks)
        level: 1
        target: VICTIM                    # VICTIM ou SELF
        chance: 25                        # en %
        cooldown: 2s
    attributes:
      attack-damage: 9
      attack-speed: 1.6
    recipe:
      type: shaped
      shape:
        - " R "
        - " R "
        - " S "
      ingredients:
        R: ruby
        S: STICK

  ruby_pickaxe:
    material: DIAMOND_PICKAXE
    name: "<red>Pioche de Rubis"
    texture: ruby_pickaxe.png
    held-texture: ruby_pickaxe_held.png
    durability: 2000
    attributes:
      attack-damage: 5
      attack-speed: 1.2
    recipe:
      type: shaped
      shape:
        - "RRR"
        - " S "
        - " S "
      ingredients:
        R: ruby
        S: STICK

  ruby_helmet:
    material: DIAMOND_HELMET
    name: "<red>Casque de Rubis"
    texture: ruby_helmet.png
    armor-texture: ruby
    durability: 550
    attributes:
      armor: 3
      armor-toughness: 2
    recipe:
      type: shaped
      shape:
        - "RRR"
        - "R R"
      ingredients:
        R: ruby

  ruby_chestplate:
    material: DIAMOND_CHESTPLATE
    name: "<red>Plastron de Rubis"
    texture: ruby_chestplate.png
    armor-texture: ruby
    durability: 800
    attributes:
      armor: 8
      armor-toughness: 2
    recipe:
      type: shaped
      shape:
        - "R R"
        - "RRR"
        - "RRR"
      ingredients:
        R: ruby

  ruby_leggings:
    material: DIAMOND_LEGGINGS
    name: "<red>Jambières de Rubis"
    texture: ruby_leggings.png
    armor-texture: ruby
    durability: 750
    attributes:
      armor: 6
      armor-toughness: 2
    recipe:
      type: shaped
      shape:
        - "RRR"
        - "R R"
        - "R R"
      ingredients:
        R: ruby

  ruby_boots:
    material: DIAMOND_BOOTS
    name: "<red>Bottes de Rubis"
    texture: ruby_boots.png
    armor-texture: ruby
    durability: 650
    attributes:
      armor: 3
      armor-toughness: 2
    recipe:
      type: shaped
      shape:
        - "R R"
        - "R R"
      ingredients:
        R: ruby

# ------------------------------------------------------------
#  CRAFTS (sous-section "recipe" d'un bloc ou d'un objet)
#
#  type         : shaped (forme précise) ou shapeless (sans forme)
#  amount       : (optionnel) quantité obtenue (défaut 1)
#  shape        : (shaped) 1 à 3 lignes de 1 à 3 caractères, espace = case vide
#  ingredients  : (shaped) lettre -> ingrédient
#                 (shapeless) simple liste d'ingrédients
#  Un ingrédient est un ID de bloc/objet custom (ex. ruby) ou un matériau vanilla (ex. STICK).
#
#  Exemple sans forme :
#    recipe:
#      type: shapeless
#      ingredients: [ruby, ruby, GOLD_INGOT]
# ------------------------------------------------------------
# Catégories personnalisées du menu /cb (facultatif) : un bloc ou objet avec "category: <clé>" y est rangé.
# categories:
#   mes_objets:
#     name: "<gold>Mes objets"
#     icon: EMERALD

# Bonus de sets d'armure : effets permanents selon le nombre de pièces portées.
sets:
  ruby_set:
    pieces: [ruby_helmet, ruby_chestplate, ruby_leggings, ruby_boots]
    bonuses:
      2:
        - effect: RESISTANCE
          level: 1
      4:
        - effect: SPEED
          level: 1
        - effect: FIRE_RESISTANCE
          level: 1

# Génération et envoi du resource pack
resource-pack:
  enabled: true
  # "auto" = le plugin lit le numéro de format dans ton serveur (recommandé).
  # Tu peux aussi mettre un nombre fixe, ex. 84.
  pack-format: auto
  # Utilisé uniquement si "auto" échoue
  pack-format-fallback: 84
  description: "Textures CustomBlock"
  # true = les joueurs qui refusent le pack sont expulsés
  required: True
  prompt: "<yellow>Ce serveur utilise des textures personnalisées."
  # Hébergement intégré : le plugin sert lui-même le pack en HTTP.
  # "host" = l'IP publique ou le domaine de ton serveur, "port" doit être ouvert (TCP).
  self-host:
    host: "127.0.0.1"
    port: 8163
  # Si tu héberges le pack ailleurs, indique ici son URL directe : l'hébergement intégré est alors désactivé.
  external-url: ""
